name: Keep Supabase awake

# Supabase's free plan pauses a project after a week without "a few user
# requests to the database each day". The Vercel cron can only run once a day,
# which wasn't enough (another pause warning came 2026-10-26), so this also
# queries the database directly every 4 hours.
#
# It doubles as the app's uptime check: if the database, sign-in or the site
# on Vercel stops answering, the run fails and GitHub emails whoever last
# edited this file. That email is the early warning, days before Supabase
# would pause anything.
#
# GitHub turns off scheduled workflows in a public repo after 60 days with no
# commits. The last step re-enables this workflow through the API on every
# run, which keeps it from going quiet when the repo does. If it ever does get
# turned off, re-enable it under Actions → Keep Supabase awake.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      APP: https://yourpersonaltrainer.vercel.app
    steps:
      - name: Query the database
        run: |
          set -e
          for table in profiles plans workout_sessions; do
            curl -fsS --retry 3 --retry-delay 10 "$URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          done
          curl -fsS --retry 3 --retry-delay 10 "$URL/auth/v1/health" -H "apikey: $KEY" -o /dev/null

      # The endpoint answers 503 when the database refuses it, so -f is
      # enough to fail the run.
      - name: Call the app's own keep-alive
        run: curl -fsS --retry 3 --retry-delay 10 "$APP/api/keep-alive"

      - name: Check the site itself is up
        run: curl -fsS --retry 3 --retry-delay 10 "$APP/" -o /dev/null

      - name: Keep this schedule from being switched off
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
