name: Keep Supabase awake

# Supabase's free plan pauses a project after a week without "a few user
# requests to the database each day". The Vercel cron can only run once a day,
# which wasn't enough (another pause warning came 2026-10-26), so this also
# queries the database directly every 4 hours.
#
# GitHub turns off scheduled workflows in a public repo after 60 days with no
# commits. If that happens, re-enable it under Actions → Keep Supabase awake.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Query the database
        run: |
          set -e
          for table in profiles plans workout_sessions; do
            curl -fsS "$URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          done
          curl -fsS "$URL/auth/v1/health" -H "apikey: $KEY" -o /dev/null
      - name: Call the app's own keep-alive
        run: curl -fsS https://yourpersonaltrainer.vercel.app/api/keep-alive
