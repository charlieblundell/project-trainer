name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The browser build the app runs in needs the same two public values the
    # app needs in a browser. They're the anon pair, safe to expose to a client,
    # but they live in repo secrets rather than in the tree.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the rules the app is built on
        run: |
          npm run check:evidence
          npm run check:billing
          npm run check:weekly
          npm run check:readiness
          npm run check:rebuild
          npm run check:warmup
          npm run check:plan-edit
          npm run check:loadable
          npm run check:volume
          npm run check:upgrade
          npm run check:rules
          npm run check:older
          npm run check:exercises

      # LayoutProps and friends are generated by Next, not written by hand, so
      # they have to exist before the type check runs.
      - run: npx next typegen

      - run: npx tsc --noEmit
      - run: npm run lint

      # The payment endpoints can only be checked against a running server, so
      # this step brings one up on a port the browser tests don't use. No Stripe
      # account is involved: the payloads are signed locally with a throwaway
      # secret, which is what Stripe does with the real one.
      - name: Check the payment endpoints refuse what they should
        env:
          STRIPE_WEBHOOK_SECRET: whsec_local_check
          STRIPE_SECRET_KEY: sk_test_placeholder
        run: |
          npx next dev -p 3100 > "$RUNNER_TEMP/next-dev.log" 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          npm run check:webhook || { cat "$RUNNER_TEMP/next-dev.log"; exit 1; }

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Drive the app in a browser
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
